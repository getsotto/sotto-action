name: "Sotto Setup"
description: "Install the Sotto CLI (end-to-end encrypted secret sync for developer teams)"
author: "getsotto"
branding:
  icon: "lock"
  color: "black"

inputs:
  sotto-version:
    description: >
      The sotto release to install, e.g. "v0.4.0". Required - there is no implicit "latest", so a
      new Sotto release can never silently change your CI's behaviour.
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate sotto-version (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
      run: |
        if [[ ! "$SOTTO_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::sotto-version must be an exact release such as v0.4.0" >&2
          exit 1
        fi

    - name: Validate sotto-version (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
      run: |
        if ($env:SOTTO_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
          Write-Error "sotto-version must be an exact release such as v0.4.0"
          exit 1
        }

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.0.6
        install-dir: ${{ runner.temp }}/cosign

    - name: Install sotto (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
        SOTTO_INSTALL_DIR: ${{ runner.temp }}/sotto-bin
      run: '"${{ github.action_path }}/scripts/install.sh"'

    - name: Install sotto (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
        SOTTO_INSTALL_DIR: ${{ runner.temp }}\sotto-bin
      run: '& "${{ github.action_path }}\scripts\install.ps1"'
