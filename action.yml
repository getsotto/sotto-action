name: "Sotto Setup"
description: "Install the Sotto CLI (end-to-end encrypted secret sync for developer teams)"
author: "getsotto"
branding:
  icon: "lock"
  color: "black"

inputs:
  sotto-version:
    description: >
      The sotto release to install, e.g. "v0.4.0". Required - there is no implicit "latest", so a
      new Sotto release can never silently change your CI's behaviour.
    required: true

outputs:
  # Exactly one platform install step runs. Select the output from whichever step was not skipped.
  version:
    description: "The installed Sotto release tag"
    value: ${{ steps.install-unix.outputs.version || steps.install-windows.outputs.version }}
  target:
    description: "The installed Sotto release target"
    value: ${{ steps.install-unix.outputs.target || steps.install-windows.outputs.target }}
  binary-path:
    description: "The absolute path to the installed Sotto binary"
    value: ${{ steps.install-unix.outputs.binary-path || steps.install-windows.outputs.binary-path }}

runs:
  using: "composite"
  steps:
    # Fail before downloading cosign. The installers repeat this check because they can also be
    # invoked directly, outside the action.
    - name: Validate sotto-version (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
      run: '"${{ github.action_path }}/scripts/validate-version.sh"'

    - name: Validate sotto-version (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
      run: '& "${{ github.action_path }}\scripts\validate-version.ps1"'

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.0.6
        install-dir: ${{ runner.temp }}/cosign

    - name: Install sotto (Linux/macOS)
      id: install-unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
        SOTTO_INSTALL_DIR: ${{ runner.temp }}/sotto-bin
      run: '"${{ github.action_path }}/scripts/install.sh"'

    - name: Install sotto (Windows)
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOTTO_VERSION: ${{ inputs.sotto-version }}
        SOTTO_INSTALL_DIR: ${{ runner.temp }}\sotto-bin
      run: '& "${{ github.action_path }}\scripts\install.ps1"'
