# Exercises the action itself (this repo's whole reason to exist) across every release target it
# supports. macos-latest is ARM64, so macos-15-intel covers the separate x86_64 release; likewise,
# ubuntu-24.04-arm covers Linux ARM64 alongside the default x86_64 Ubuntu runner.
#
# The test is pinned to a real getsotto/sotto tag rather than "latest", matching the action's own
# no-implicit-latest posture.
# v0.4.0 is the first getsotto/sotto release with Windows and Linux ARM64 artifacts (v0.3.0 and
# earlier predate that work), so this is also the first version this test can actually pass
# against on windows-latest.

name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reuses the identical matrix before it creates or moves any tag.
  workflow_call:

env:
  SOTTO_TEST_VERSION: v0.4.0

jobs:
  reject-invalid-version:
    name: reject-invalid-version (${{ matrix.runner }}, ${{ matrix.version.name }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
        version:
          - name: empty
            value: ""
          - name: floating
            value: latest
          - name: partial
            value: v0.4
          - name: prerelease
            value: v0.4.0-rc.1
          - name: uppercase
            value: V0.4.0
          - name: trailing-newline
            value: "v0.4.0\n"
          - name: four-components
            value: v0.4.0.1
          - name: leading-dot
            value: v.0.4
          - name: trailing-dot
            value: v0.4.0.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Linux validation errors
        if: runner.os != 'Windows'
        shell: bash
        env:
          SOTTO_VERSION: ${{ matrix.version.value }}
        run: |
          set -euo pipefail
          set +e
          output="$(scripts/validate-version.sh 2>&1)"
          status=$?
          set -e
          expected="$(printf '%s\n' \
            '::error::sotto-version must be an exact release such as v0.4.0' \
            'error: sotto-version must be an exact release such as v0.4.0')"
          test "$status" -ne 0
          test "$output" = "$expected"

          set +e
          output="$(scripts/install.sh 2>&1)"
          status=$?
          set -e
          expected='error: sotto-version must be an exact release such as v0.4.0'
          test "$status" -ne 0
          test "$output" = "$expected"

      - name: Check Windows validation errors
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOTTO_VERSION: ${{ matrix.version.value }}
        run: |
          $ErrorActionPreference = "Stop"
          $Expected = "error: sotto-version must be an exact release such as v0.4.0"
          $OutputPath = Join-Path $env:RUNNER_TEMP "validator-output.txt"
          try {
            # Capture Write-Host so the expected failure does not create red annotations on this
            # passing test job. The action-routing check below still exercises the annotation.
            & scripts/validate-version.ps1 *> $OutputPath
            throw "validator accepted an invalid version"
          } catch {
            if ($_.Exception.Message -ne $Expected) {
              throw "unexpected validation error: $($_.Exception.Message)"
            }
          }
          $Annotation = (Get-Content -Raw $OutputPath).TrimEnd()
          if ($Annotation -ne "::error::sotto-version must be an exact release such as v0.4.0") {
            throw "unexpected validation annotation: $Annotation"
          }

          try {
            & scripts/install.ps1
            throw "installer accepted an invalid version"
          } catch {
            if ($_.Exception.Message -ne $Expected) {
              throw "unexpected installer validation error: $($_.Exception.Message)"
            }
          }

      # Also exercise action.yml's Linux and Windows routing after checking both validation paths.
      - name: Check action rejection
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          sotto-version: ${{ matrix.version.value }}

      # The cosign installer creates this directory. Its absence proves validation ran first.
      - name: Check Linux action outcome
        if: runner.os != 'Windows'
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          set -euo pipefail
          test "$ACTION_OUTCOME" = "failure"
          test ! -e "$RUNNER_TEMP/cosign"

      - name: Check Windows action outcome
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ACTION_OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ACTION_OUTCOME -ne "failure") {
            throw "expected the action to reject the invalid version"
          }
          if (Test-Path (Join-Path $env:RUNNER_TEMP "cosign")) {
            throw "cosign was installed before version validation failed"
          }

  reject-missing-cosign:
    name: reject-missing-cosign (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Linux missing cosign error
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fake_bin="$RUNNER_TEMP/no-cosign-bin"
          mkdir -p "$fake_bin"
          for utility in dirname mktemp rm; do
            ln -s "$(command -v "$utility")" "$fake_bin/$utility"
          done
          sentinel="$RUNNER_TEMP/download-attempted"
          printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "download attempted" >> "$DOWNLOAD_SENTINEL"' 'exit 1' > "$fake_bin/curl"
          chmod +x "$fake_bin/curl"

          github_path="$RUNNER_TEMP/github-path"
          github_output="$RUNNER_TEMP/github-output"
          install_dir="$RUNNER_TEMP/sotto-bin"
          printf '%s' path-sentinel > "$github_path"
          printf '%s' output-sentinel > "$github_output"

          set +e
          output="$(
            PATH="$fake_bin" \
            DOWNLOAD_SENTINEL="$sentinel" \
            SOTTO_VERSION=v1.2.3 \
            SOTTO_INSTALL_DIR="$install_dir" \
            GITHUB_PATH="$github_path" \
            GITHUB_OUTPUT="$github_output" \
            scripts/install.sh 2>&1
          )"
          status=$?
          set -e

          test "$status" -ne 0
          test "$output" = 'error: cosign is required to verify the Sotto release'
          test ! -e "$sentinel"
          test ! -e "$install_dir"
          test "$(cat "$github_path")" = path-sentinel
          test "$(cat "$github_output")" = output-sentinel

      - name: Check Windows missing cosign error
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Define the PowerShell download sentinel before narrowing PATH so the test remains
          # independent of the hosted runner's installed utilities.
          $FakeBin = Join-Path $env:RUNNER_TEMP "no-cosign-bin"
          New-Item -ItemType Directory -Path $FakeBin | Out-Null
          $Sentinel = Join-Path $env:RUNNER_TEMP "download-attempted"
          $GithubPath = Join-Path $env:RUNNER_TEMP "github-path"
          $GithubOutput = Join-Path $env:RUNNER_TEMP "github-output"
          $InstallDir = Join-Path $env:RUNNER_TEMP "sotto-bin"
          $PathSentinel = "path-sentinel"
          $OutputSentinel = "output-sentinel"
          Set-Content -Path $GithubPath -Value $PathSentinel -NoNewline
          Set-Content -Path $GithubOutput -Value $OutputSentinel -NoNewline

          function Invoke-WebRequest {
            Set-Content -Path $env:DOWNLOAD_SENTINEL -Value "download attempted" -NoNewline
            throw "download attempted"
          }

          # PowerShell is already running; restrict only child executable lookup so cosign is
          # guaranteed absent while the installer still uses its normal cmdlets.
          $env:PATH = $FakeBin
          $env:DOWNLOAD_SENTINEL = $Sentinel
          $env:SOTTO_VERSION = "v1.2.3"
          $env:SOTTO_INSTALL_DIR = $InstallDir
          $env:GITHUB_PATH = $GithubPath
          $env:GITHUB_OUTPUT = $GithubOutput
          $Expected = "error: cosign is required to verify the Sotto release"

          try {
            & scripts/install.ps1
            throw "installer accepted a missing cosign executable"
          } catch {
            if ($_.Exception.Message -ne $Expected) {
              throw "unexpected missing cosign error: $($_.Exception.Message)"
            }
          }

          if (Test-Path $Sentinel) {
            throw "installer attempted a download before checking cosign"
          }
          if (Test-Path $InstallDir) {
            throw "installer created an install directory before checking cosign"
          }
          if ((Get-Content -Raw $GithubPath) -ne $PathSentinel) {
            throw "installer changed GITHUB_PATH before checking cosign"
          }
          if ((Get-Content -Raw $GithubOutput) -ne $OutputSentinel) {
            throw "installer changed GITHUB_OUTPUT before checking cosign"
          }

  reject-missing-release:
    name: reject-missing-release (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The archive 404s before signature verification. A fake cosign only satisfies the
      # installer's precondition, isolating the missing-release path from another download.
      - name: Check Linux missing release error
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fake_bin="$RUNNER_TEMP/fake-bin"
          mkdir -p "$fake_bin"
          ln -s /usr/bin/true "$fake_bin/cosign"

          set +e
          output="$(
            PATH="$fake_bin:$PATH" \
            SOTTO_VERSION=v999.999.999 \
            SOTTO_INSTALL_DIR="$RUNNER_TEMP/sotto-bin" \
            GITHUB_PATH="$RUNNER_TEMP/github-path" \
            GITHUB_OUTPUT="$RUNNER_TEMP/github-output" \
            scripts/install.sh 2>&1
          )"
          status=$?
          set -e

          expected="error: release asset not found: https://github.com/getsotto/sotto/releases/download/v999.999.999/sotto-v999.999.999-x86_64-unknown-linux-gnu.tar.gz"
          actual="$(printf '%s\n' "$output" | tail -n 1)"
          test "$status" -ne 0
          test "$actual" = "$expected"

      - name: Check Windows missing release error
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $FakeBin = Join-Path $env:RUNNER_TEMP "fake-bin"
          New-Item -ItemType Directory -Path $FakeBin | Out-Null
          Set-Content -Path (Join-Path $FakeBin "cosign.cmd") -Value "@exit /b 0" -Encoding ASCII

          $env:PATH = "$FakeBin;$env:PATH"
          $env:SOTTO_VERSION = "v999.999.999"
          $env:SOTTO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "sotto-bin"
          $env:GITHUB_PATH = Join-Path $env:RUNNER_TEMP "github-path"
          $env:GITHUB_OUTPUT = Join-Path $env:RUNNER_TEMP "github-output"
          $Expected = "error: release asset not found: https://github.com/getsotto/sotto/releases/download/v999.999.999/sotto-v999.999.999-x86_64-pc-windows-msvc.zip"

          try {
            & scripts/install.ps1
            throw "installer accepted a version with no release"
          } catch {
            if ($_.Exception.Message -ne $Expected) {
              throw "unexpected missing release error: $($_.Exception.Message)"
            }
          }

  reject-tampered-checksum:
    name: reject-tampered-checksum (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Linux/macOS checksum errors
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/sotto-fixture"
          cp .github/fixtures/checksum/sotto-fixture "$fixture"
          printf 'tampered\n' >> "$fixture"

          valid_fixture="$RUNNER_TEMP/sotto-fixture-valid"
          cp .github/fixtures/checksum/sotto-fixture "$valid_fixture"
          printf '%s\n' \
            '  e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  *sotto-fixture-valid  ' \
            > "$RUNNER_TEMP/SHA256SUMS-binary"

          # Regression: a parent directory containing spaces must be handled, and the helper
          # must work when invoked by absolute path from an unrelated working directory.
          # Fixtures are created here, before any PATH restriction, so the macOS leg can use
          # the same absolute paths once only shasum and awk remain on PATH.
          spaced_dir="$RUNNER_TEMP/dir with spaces"
          mkdir -p "$spaced_dir"
          spaced_fixture="$spaced_dir/sotto-fixture"
          cp .github/fixtures/checksum/sotto-fixture "$spaced_fixture"
          cp .github/fixtures/checksum/SHA256SUMS "$spaced_dir/SHA256SUMS"
          root="$PWD"

          # A valid sotto-fixture copy for the multi-file manifests below; the other files
          # those manifests list are deliberately never created because only the requested
          # asset is hashed.
          multi_dir="$RUNNER_TEMP/multi"
          mkdir -p "$multi_dir"
          multi_fixture="$multi_dir/sotto-fixture"
          cp .github/fixtures/checksum/sotto-fixture "$multi_fixture"

          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS also ships sha256sum; restrict PATH so this leg proves the shasum fallback.
            checksum_bin="$RUNNER_TEMP/checksum-bin"
            mkdir -p "$checksum_bin"
            ln -s "$(command -v shasum)" "$checksum_bin/shasum"
            ln -s "$(command -v awk)" "$checksum_bin/awk"
            export PATH="$checksum_bin"
          fi

          PATH="$PATH" scripts/verify-checksum.sh "$valid_fixture" "$RUNNER_TEMP/SHA256SUMS-binary"

          set +e
          output="$(scripts/verify-checksum.sh \
            "$fixture" .github/fixtures/checksum/SHA256SUMS 2>&1)"
          status=$?
          set -e

          test "$status" -ne 0
          test "$output" = 'error: checksum verification failed for sotto-fixture'

          # Exercise the manifest cardinality guard separately from the digest mismatch above.
          sums="$RUNNER_TEMP/SHA256SUMS"
          printf '%s\n' \
            'e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  other-file' \
            > "$sums"
          set +e
          output="$(scripts/verify-checksum.sh "$fixture" "$sums" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = 'error: sotto-fixture must appear exactly once in SHA256SUMS'

          printf '%s\n' \
            'e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  sotto-fixture extrajunk' \
            > "$sums"
          set +e
          output="$(scripts/verify-checksum.sh "$fixture" "$sums" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = 'error: sotto-fixture must appear exactly once in SHA256SUMS'

          printf '%s\n' \
            'not-a-valid-sha256  sotto-fixture' \
            > "$sums"
          set +e
          output="$(scripts/verify-checksum.sh "$fixture" "$sums" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = 'error: sotto-fixture must appear exactly once in SHA256SUMS'

          printf '%s\n%s\n' \
            'e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  sotto-fixture' \
            'e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  sotto-fixture' \
            > "$sums"
          set +e
          output="$(scripts/verify-checksum.sh "$fixture" "$sums" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = 'error: sotto-fixture must appear exactly once in SHA256SUMS'

          # Real release manifests list several files, so the helper must select the exact
          # asset name while ignoring unrelated and near-match entries wherever they appear.
          fixture_sum='e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f'
          near_sum='b5bb9d8014a0f9b1d61e21e796d78dccdf1352f23cd32812f4850b878ae4944c'
          other_sum='2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae'
          multi_sums="$RUNNER_TEMP/SHA256SUMS-multi"

          printf '%s\n%s\n%s\n' \
            "$fixture_sum  sotto-fixture" \
            "$near_sum  sotto-fixture.sigstore.json" \
            "$other_sum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz" \
            > "$multi_sums"
          scripts/verify-checksum.sh "$multi_fixture" "$multi_sums"

          printf '%s\n%s\n%s\n' \
            "$near_sum  sotto-fixture.sigstore.json" \
            "$fixture_sum  sotto-fixture" \
            "$other_sum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz" \
            > "$multi_sums"
          scripts/verify-checksum.sh "$multi_fixture" "$multi_sums"

          # The entry in last position also carries the binary-mode '*' marker.
          printf '%s\n%s\n%s\n' \
            "$other_sum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz" \
            "$near_sum  sotto-fixture.sigstore.json" \
            "$fixture_sum  *sotto-fixture" \
            > "$multi_sums"
          scripts/verify-checksum.sh "$multi_fixture" "$multi_sums"

          # A manifest with only near-match and unrelated names misses the asset entirely.
          printf '%s\n%s\n' \
            "$near_sum  sotto-fixture.sigstore.json" \
            "$other_sum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz" \
            > "$multi_sums"
          set +e
          output="$(scripts/verify-checksum.sh "$multi_fixture" "$multi_sums" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = 'error: sotto-fixture must appear exactly once in SHA256SUMS'

          # Regression: parent directories with spaces must work end to end. Fixtures were
          # copied into the spaced directory and absolute paths resolved before the macOS
          # PATH restriction above, so this leg exercises the shasum fallback there too.
          (cd "$RUNNER_TEMP" && "$root/scripts/verify-checksum.sh" "$spaced_fixture" "$spaced_dir/SHA256SUMS")

          printf 'tampered\n' >> "$spaced_fixture"
          set +e
          output="$(cd "$RUNNER_TEMP" && "$root/scripts/verify-checksum.sh" "$spaced_fixture" "$spaced_dir/SHA256SUMS" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          test "$output" = 'error: checksum verification failed for sotto-fixture'

      - name: Check Windows checksum errors
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Fixture = Join-Path $env:RUNNER_TEMP "sotto-fixture"
          Copy-Item .github/fixtures/checksum/sotto-fixture $Fixture
          Add-Content -NoNewline -Path $Fixture -Value "tampered"
          $Expected = "error: checksum verification failed for sotto-fixture"

          $ValidFixture = Join-Path $env:RUNNER_TEMP "sotto-fixture-valid"
          Copy-Item .github/fixtures/checksum/sotto-fixture $ValidFixture
          # Exercise the binary marker and padded whitespace through the Windows helper.
          $BinaryManifest = Join-Path $env:RUNNER_TEMP "SHA256SUMS-binary"
          $ValidHash = (Get-FileHash -Algorithm SHA256 -Path $ValidFixture).Hash.ToLowerInvariant()
          Set-Content -Path $BinaryManifest -Value "  $ValidHash  *sotto-fixture-valid  "
          & scripts/verify-checksum.ps1 -AssetPath $ValidFixture -SumsPath $BinaryManifest

          try {
            & scripts/verify-checksum.ps1 `
              -AssetPath $Fixture `
              -SumsPath .github/fixtures/checksum/SHA256SUMS
            throw "checksum helper accepted a tampered fixture"
          } catch {
            if ($_.Exception.Message -ne $Expected) {
              throw "unexpected checksum error: $($_.Exception.Message)"
            }
          }

          # Exercise the manifest cardinality guard separately from the digest mismatch above.
          $Manifest = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
          Set-Content -Path $Manifest -Value "e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  other-file"
          $ExpectedManifest = "error: sotto-fixture must appear exactly once in SHA256SUMS"
          try {
            & scripts/verify-checksum.ps1 -AssetPath $Fixture -SumsPath $Manifest
            throw "checksum helper accepted a missing fixture entry"
          } catch {
            if ($_.Exception.Message -ne $ExpectedManifest) {
              throw "unexpected manifest error: $($_.Exception.Message)"
            }
          }

          Set-Content -Path $Manifest -Value @(
            "e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  sotto-fixture"
            "e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  sotto-fixture"
          )
          try {
            & scripts/verify-checksum.ps1 -AssetPath $Fixture -SumsPath $Manifest
            throw "checksum helper accepted duplicate fixture entries"
          } catch {
            if ($_.Exception.Message -ne $ExpectedManifest) {
              throw "unexpected duplicate manifest error: $($_.Exception.Message)"
            }
          }

          Set-Content -Path $Manifest -Value "e80b71cd14d3cbd65f4173abcbfcf01a545dbca32a72d575108b553a648cc96f  sotto-fixture extrajunk"
          try {
            & scripts/verify-checksum.ps1 -AssetPath $Fixture -SumsPath $Manifest
            throw "checksum helper accepted a trailing-junk entry"
          } catch {
            if ($_.Exception.Message -ne $ExpectedManifest) {
              throw "unexpected trailing-junk error: $($_.Exception.Message)"
            }
          }

          Set-Content -Path $Manifest -Value "not-a-valid-sha256  sotto-fixture"
          try {
            & scripts/verify-checksum.ps1 -AssetPath $Fixture -SumsPath $Manifest
            throw "checksum helper accepted a malformed hash"
          } catch {
            if ($_.Exception.Message -ne $ExpectedManifest) {
              throw "unexpected malformed-hash error: $($_.Exception.Message)"
            }
          }

          # Real release manifests list several files, so the helper must select the exact
          # asset name while ignoring unrelated and near-match entries wherever they appear.
          # The other listed files do not exist locally: only the requested asset is hashed.
          $MultiDir = Join-Path $env:RUNNER_TEMP "multi"
          New-Item -ItemType Directory -Path $MultiDir | Out-Null
          $MultiFixture = Join-Path $MultiDir "sotto-fixture"
          Copy-Item .github/fixtures/checksum/sotto-fixture $MultiFixture
          $MultiManifest = Join-Path $env:RUNNER_TEMP "SHA256SUMS-multi"
          # Normalise case explicitly because the working copy's line endings can vary.
          $MultiHash = (Get-FileHash -Algorithm SHA256 -Path $MultiFixture).Hash.ToLowerInvariant()
          $NearSum = "b5bb9d8014a0f9b1d61e21e796d78dccdf1352f23cd32812f4850b878ae4944c"
          $OtherSum = "2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"

          Set-Content -Path $MultiManifest -Value @(
            "$MultiHash  sotto-fixture"
            "$NearSum  sotto-fixture.sigstore.json"
            "$OtherSum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz"
          )
          & scripts/verify-checksum.ps1 -AssetPath $MultiFixture -SumsPath $MultiManifest

          Set-Content -Path $MultiManifest -Value @(
            "$NearSum  sotto-fixture.sigstore.json"
            "$MultiHash  sotto-fixture"
            "$OtherSum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz"
          )
          & scripts/verify-checksum.ps1 -AssetPath $MultiFixture -SumsPath $MultiManifest

          # The entry in last position also carries the binary-mode '*' marker.
          Set-Content -Path $MultiManifest -Value @(
            "$OtherSum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz"
            "$NearSum  sotto-fixture.sigstore.json"
            "$MultiHash  *sotto-fixture"
          )
          & scripts/verify-checksum.ps1 -AssetPath $MultiFixture -SumsPath $MultiManifest

          # A manifest with only near-match and unrelated names misses the asset entirely.
          Set-Content -Path $MultiManifest -Value @(
            "$NearSum  sotto-fixture.sigstore.json"
            "$OtherSum  sotto-v0.4.0-aarch64-apple-darwin.tar.gz"
          )
          try {
            & scripts/verify-checksum.ps1 -AssetPath $MultiFixture -SumsPath $MultiManifest
            throw "checksum helper accepted a manifest without the asset"
          } catch {
            if ($_.Exception.Message -ne $ExpectedManifest) {
              throw "unexpected multi-file manifest error: $($_.Exception.Message)"
            }
          }

          # Regression: parent directories with spaces must work end to end, invoking the
          # helper by absolute path from an unrelated working directory.
          $SpacedDir = Join-Path $env:RUNNER_TEMP "dir with spaces"
          New-Item -ItemType Directory -Path $SpacedDir | Out-Null
          $SpacedFixture = Join-Path $SpacedDir "sotto-fixture"
          Copy-Item .github/fixtures/checksum/sotto-fixture $SpacedFixture
          $SpacedManifest = Join-Path $SpacedDir "SHA256SUMS"
          # Normalise case explicitly because the working copy's line endings can vary.
          $SpacedHash = (Get-FileHash -Algorithm SHA256 -Path $SpacedFixture).Hash.ToLowerInvariant()
          Set-Content -Path $SpacedManifest -Value "$SpacedHash  sotto-fixture"
          $ChecksumHelper = Join-Path $env:GITHUB_WORKSPACE "scripts/verify-checksum.ps1"

          Push-Location $env:RUNNER_TEMP
          try {
            & $ChecksumHelper -AssetPath $SpacedFixture -SumsPath $SpacedManifest
          } finally {
            Pop-Location
          }

          Add-Content -NoNewline -Path $SpacedFixture -Value "tampered"
          try {
            Push-Location $env:RUNNER_TEMP
            try {
              & $ChecksumHelper -AssetPath $SpacedFixture -SumsPath $SpacedManifest
              throw "checksum helper accepted a tampered fixture in a spaced directory"
            } finally {
              Pop-Location
            }
          } catch {
            if ($_.Exception.Message -ne $Expected) {
              throw "unexpected checksum error: $($_.Exception.Message)"
            }
          }

  install-and-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: sotto
        name: Install sotto
        uses: ./
        with:
          sotto-version: ${{ env.SOTTO_TEST_VERSION }}
      - name: Check the installed version and outputs
        shell: bash
        env:
          OUTPUT_VERSION: ${{ steps.sotto.outputs.version }}
          OUTPUT_TARGET: ${{ steps.sotto.outputs.target }}
          OUTPUT_BINARY_PATH: ${{ steps.sotto.outputs.binary-path }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual="$(sotto --version)"
          echo "$actual"
          expected="sotto ${SOTTO_TEST_VERSION#v}"
          if [ "$actual" != "$expected" ]; then
            echo "expected '$actual' to equal '$expected'" >&2
            exit 1
          fi
          test "$OUTPUT_VERSION" = "$SOTTO_TEST_VERSION"
          test "$OUTPUT_TARGET" = "$EXPECTED_TARGET"
          test -f "$OUTPUT_BINARY_PATH"
